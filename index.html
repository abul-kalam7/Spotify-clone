<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="https://sets.hugeicons.com/YOUR-SET-ID.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/utility.css">
</head>

<body>
  <div class="container flex bg-black">
    <div class="left   ">
      <div class="home bg-grey rounded m-1 p-1">
        <div class="logo" style="display: flex; align-items: center;"><img class="invert" src="img/logo.svg" alt="logo">
          &nbsp;Spotify</div>
        <ul>
          <li><img class="invert" src="img/home.svg" alt="home">Home</li>
          <li><img class="invert" src="img/search.svg" alt="search">Search</li>
        </ul>
      </div>
      <div class="library bg-grey rounded m-1 p-1">
        <div class="heading">
          <img class="invert" src="img/playlist.svg" alt="" srcset="">
          <h2>
            Your Library
          </h2>
        </div>
        <div class="footer">
          <div><a href="https://www.spotify.com/bd-en/legal/"><span>Legal</span></a></div>
          <div><a href="https://www.spotify.com/bd-en/safetyandprivacy/"><span>Safety &amp; Privacy Center</span></a>
          </div>
          <div><a href="https://www.spotify.com/bd-en/legal/privacy-policy/"><span>Privacy Policy</span></a></div>
          <div><a href="https://www.spotify.com/bd-en/legal/cookies-policy/"><span>Cookies</span></a></div>
          <div><a href="https://www.spotify.com/bd-en/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
          <div><a href="https://www.spotify.com/bd-en/accessibility/"><span>Accessibility</span></a></div>
        </div>
      </div>
    </div>




    <div class="right rounded bg-grey   ">
      <div class="header">
        <div class="nav">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
              stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
              stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

        </div>
        <div class="buttons">
          <button>Signup</button>
          <button>Login</button>
        </div>
      </div>
      <div class="spotifyPlaylists">
        <h1>Spotify Playlists</h1>
        <div class="cardContainer">
          <div class="card ">
               <div class="play">
                   <svg width="16" height="16" viewBox="0 0 24 24" fill="#000" xmlns="http://www.w3.org/2000/svg">
                     <path d="M5 20V4L19 12L5 20Z" stroke="#141B34" stroke-width="1.5" stroke-linejoin="round" />
                   </svg>
               </div>

            <img src="https://i.scdn.co/image/ab67616d00001e02d5754cde395f5c46792186c7" alt="" srcset="">
            <h2>Param Sundari</h2>
            <p>Sachin-Jigar,Sonu Nigam,Krishnakali Saha,Amitabh</p>
          </div>

          <div class="card ">
            <img src="https://i.scdn.co/image/ab67616d00001e02d5754cde395f5c46792186c7" alt="" srcset="">
            <h2>Param Sundari</h2>
            <p>Sachin-Jigar,Sonu Nigam,Krishnakali Saha,Amitabh</p>
          </div>

        </div>
      </div>
    </div>
  </div>





  <script src="script.js"></script>
</body>

</html>
